name: Publish agentc Toolkit

# The toolkit is versioned independently of agentc: it is rebuilt and published
# only when its inputs change, so an agentc release never reissues a toolkit
# that nobody touched. CI owns the version bump and keeps agentc in sync.
on:
  push:
    branches: [main]
    paths:
      - "scripts/toolkit/**"
      - ".github/workflows/toolkit.yml"
  workflow_dispatch:

concurrency:
  group: toolkit-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}

    steps:
      # Always work from the newest main. A queued run may have been superseded
      # by another Toolkit change while it waited for the concurrency lock.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare toolkit version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/toolkit/manifest.sh

          version="$TOOLKIT_VERSION"
          tag="toolkit-v$version"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            # This is either a new Toolkit change or a stale queued/retried run.
            # Comparing all release inputs to the current tag distinguishes them.
            if git diff --quiet "$tag" -- scripts/toolkit .github/workflows/toolkit.yml; then
              echo "Toolkit inputs already match $tag; there is nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$((version + 1))
            tag="toolkit-v$version"
            while git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; do
              version=$((version + 1))
              tag="toolkit-v$version"
            done
          fi

          sed -i -E "s/^TOOLKIT_VERSION=[0-9]+$/TOOLKIT_VERSION=$version/" \
            scripts/toolkit/manifest.sh
          sed -i -E \
            "s/(static let version = \")[^\"]+(\".*)/\\1$version\\2/" \
            Sources/agentc/ToolkitManager.swift

          test "$(grep -c "^TOOLKIT_VERSION=$version$" scripts/toolkit/manifest.sh)" -eq 1
          test "$(grep -c "static let version = \"$version\"" \
            Sources/agentc/ToolkitManager.swift)" -eq 1

          if ! git diff --quiet -- \
            scripts/toolkit/manifest.sh Sources/agentc/ToolkitManager.swift
          then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            branch="automation/toolkit-v${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
            git add scripts/toolkit/manifest.sh Sources/agentc/ToolkitManager.swift
            git commit -m "chore(toolkit): bump Toolkit to v$version"
            git push --set-upstream origin "$branch"

            # main requires pull requests. Merge this mechanical bump through a
            # short-lived branch, then publish from the resulting main commit.
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(toolkit): bump Toolkit to v$version" \
              --body "Automated version bump for Toolkit workflow run $GITHUB_RUN_ID.")
            gh pr merge "$pr_url" --squash --delete-branch
            commit=$(gh pr view "$pr_url" --json mergeCommit,state \
              --jq 'select(.state == "MERGED") | .mergeCommit.oid')
            test -n "$commit"
          else
            commit=$(git rev-parse HEAD)
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Read toolkit version
        id: manifest
        run: |
          source scripts/toolkit/manifest.sh
          echo "version=$TOOLKIT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=toolkit-v$TOOLKIT_VERSION" >> "$GITHUB_OUTPUT"

          test "$TOOLKIT_VERSION" = "${{ needs.prepare.outputs.version }}"
          test "toolkit-v$TOOLKIT_VERSION" = "${{ needs.prepare.outputs.tag }}"

      - name: Check agentc agrees on the version
        run: |
          source scripts/toolkit/manifest.sh
          declared=$(grep -oE 'static let version = "[^"]+"' Sources/agentc/ToolkitManager.swift \
            | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$declared" != "$TOOLKIT_VERSION" ]; then
            echo "::error::manifest.sh has TOOLKIT_VERSION=$TOOLKIT_VERSION but" \
                 "ToolkitManager.version is \"$declared\" — they must match."
            exit 1
          fi

      - name: Refuse to republish an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.manifest.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.manifest.outputs.tag }} already exists." \
                 "A concurrent publisher created it after this run selected its version."
            exit 1
          fi

      # Every tool ships as a prebuilt static binary, so one runner produces both
      # bundles; nothing here is compiled for the target architecture.
      - name: Build bundles
        run: |
          ./scripts/toolkit/build-toolkit.sh --arch x64 --output dist
          ./scripts/toolkit/build-toolkit.sh --arch arm64 --output dist

      - name: Verify bundle contents
        run: |
          for arch in x64 arm64; do
            echo "== $arch =="
            tar tzf "dist/agentc-toolkit-$arch-linux-static.tar.gz"
            tar xzOf "dist/agentc-toolkit-$arch-linux-static.tar.gz" ./TOOLKIT
          done
          # The x64 bundle runs here, so it can prove itself before shipping.
          mkdir -p check && tar xzf dist/agentc-toolkit-x64-linux-static.tar.gz -C check
          ./check/bin/curl --version
          ./check/bin/jq --version
          ./check/bin/rg --version
          CURL_CA_BUNDLE=./check/share/ca-certificates.crt \
            ./check/bin/curl -fsS -o /dev/null https://github.com/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: agentc Toolkit v${{ steps.manifest.outputs.version }}
          body: |
            Tools mounted read-only into every agentc container at
            `/agent-isolation/toolkit`, built from `scripts/toolkit/manifest.sh`.

            Published independently of agentc releases: this bundle changes only
            when its release inputs do.
          files: dist/*.tar.gz
