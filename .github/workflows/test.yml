name: Test

# Keep the workflow/check present even for docs-only PRs. The cheap changes job
# selects expensive jobs from the complete diff.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.changes.outputs.unit }}
      integration: ${{ steps.changes.outputs.integration }}
      runtime: ${{ steps.changes.outputs.runtime }}
      packet: ${{ steps.changes.outputs.packet }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI selection and build output discovery
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          bash scripts/test-build-paths.sh

      - name: Select affected jobs
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/changes.py --event "$EVENT" --base "$BASE" --head "$HEAD"

  unit-tests:
    needs: changes
    if: needs.changes.outputs.unit == 'true' || needs.changes.outputs.packet == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            traits: ContainerRuntimeAppleContainer,ContainerRuntimeDocker
          - os: macos-26-intel
            arch: x64
            traits: ContainerRuntimeAppleContainer,ContainerRuntimeDocker

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          cache-scope: unit

      - name: Run unit tests
        if: needs.changes.outputs.unit == 'true'
        run: swift test --disable-default-traits --traits "${{ matrix.traits }}" --skip AgentcIntegrationTests

      - name: Check CLI tests with a single cooperative worker
        if: needs.changes.outputs.unit == 'true'
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: swift test --skip-build --disable-default-traits --traits "${{ matrix.traits }}" --filter AgentcTests

      - name: Check packet engine and readiness under AddressSanitizer
        if: needs.changes.outputs.packet == 'true'
        run: |
          SANITIZE=address sh scripts/test-packet-engine.sh --control-eof
          SANITIZE=address sh scripts/test-packet-engine.sh --readiness --control-eof

  # End-to-end coverage for the hardened runtimes the Docker adapter prefers over `runc`.
  # Each job installs one runtime on the runner's Docker daemon and then asserts that
  # discovery finds it, selects it, and that containers really stop sharing the host kernel.
  #
  # gVisor needs no hardware support (its default `systrap` platform is pure userspace), so
  # it runs as a required job on both architectures. Kata needs `/dev/kvm`.
  runtime-e2e:
    name: Runtime E2E (${{ matrix.runtime }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: runsc
            os: ubuntu-24.04
            arch: x64
            required: true
          - runtime: runsc
            os: ubuntu-24.04-arm
            arch: arm64
            required: true
          - runtime: kata
            os: ubuntu-24.04
            arch: x64
            required: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kata boots a VM per container, so without KVM it either fails outright or silently
      # falls back to QEMU's TCG interpreter, which is far too slow to test against.
      - name: Probe KVM
        id: kvm
        if: matrix.runtime == 'kata'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || echo "no virtualization flags in /proc/cpuinfo"
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::/dev/kvm is usable on this runner"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::/dev/kvm is unavailable on this runner — skipping the Kata E2E"
          fi

      - name: Setup Swift
        if: matrix.runtime != 'kata' || steps.kvm.outputs.available == 'true'
        uses: ./.github/actions/setup-swift
        with:
          cache-scope: runtime-${{ matrix.runtime }}

      - name: Install gVisor
        if: matrix.runtime == 'runsc'
        run: |
          set -euo pipefail
          # Releases ship as a single tarball: `runsc`, the containerd shim, and a `gvisor-bin/`
          # of sidecar binaries that runsc expects next to itself (it would otherwise try to
          # download them at runtime; see gvisor.dev/issue/13718).
          url="https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)"
          wget -q "${url}/gvisor.tar.bz2" "${url}/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          command -v bzip2 >/dev/null || { sudo apt-get update && sudo apt-get install -y bzip2; }
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin --no-same-owner \
            runsc containerd-shim-runsc-v1 gvisor-bin
          sudo chmod -R a+rX /usr/local/bin/runsc /usr/local/bin/containerd-shim-runsc-v1 \
            /usr/local/bin/gvisor-bin
          /usr/local/bin/runsc --version
          # Registers a Docker runtime named `runsc` in /etc/docker/daemon.json.
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker

      - name: Install Kata Containers
        if: matrix.runtime == 'kata' && steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Release asset names have shifted across Kata 3.x (kata-static, kata-go-static,
          # .tar.xz, .tar.zst), so pick whatever the latest release actually publishes.
          asset=$(curl -fsSL https://api.github.com/repos/kata-containers/kata-containers/releases/latest \
            | jq -r '.assets[].browser_download_url
                     | select(test("kata(-go)?-static-.*(amd64|x86_64)\\.tar\\.(xz|zst)$"))' \
            | head -n1)
          test -n "$asset" || { echo "::error::no Kata static release asset found"; exit 1; }
          echo "Installing $asset"
          sudo apt-get update && sudo apt-get install -y zstd
          curl -fsSL -o kata-static.tar "$asset"
          sudo tar -xf kata-static.tar -C /
          /opt/kata/bin/kata-runtime --version

          # Register the shim as a Docker runtime, merging into any existing daemon.json.
          sudo mkdir -p /etc/docker
          [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          jq '.runtimes.kata = {"runtimeType": "/opt/kata/bin/containerd-shim-kata-v2"}' \
            /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Verify the runtime is registered with Docker
        if: matrix.runtime != 'kata' || steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker info --format 'default={{.DefaultRuntime}} runtimes={{json .Runtimes}}'
          docker info --format '{{json .Runtimes}}' | jq -e 'has("${{ matrix.runtime }}")'
          docker run --rm --runtime '${{ matrix.runtime }}' alpine:latest uname -r

      - name: Run runtime E2E tests
        if: matrix.runtime != 'kata' || steps.kvm.outputs.available == 'true'
        run: swift test --disable-default-traits --traits ContainerRuntimeDocker --filter DockerHardenedRuntimeE2ETests
        env:
          AGENTC_TEST_DOCKER_RUNTIME: ${{ matrix.runtime }}

  # One native test bundle, SDK, bootstrap, image, and fixture setup per arch.
  # Both glibc and musl release binaries still get the full integration suite.
  linux-tests:
    needs: changes
    if: needs.changes.outputs.unit == 'true' || needs.changes.outputs.integration == 'true'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            swift-sdk: x86_64-swift-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            swift-sdk: aarch64-swift-linux-musl

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          static-sdk: ${{ needs.changes.outputs.integration }}
          cache-scope: linux

      - name: Build native test bundle once
        run: swift build --build-tests --disable-default-traits --traits ContainerRuntimeDocker

      - name: Run unit tests
        if: needs.changes.outputs.unit == 'true'
        run: swift test --skip-build --disable-default-traits --traits ContainerRuntimeDocker --skip AgentcIntegrationTests

      - name: Build base image locally
        if: needs.changes.outputs.integration == 'true'
        run: docker build -t ghcr.io/laosb/claudec:latest .

      - name: Build bootstrap binary
        if: needs.changes.outputs.integration == 'true'
        run: |
          args=(--product agentc-bootstrap -c release --disable-default-traits --traits ContainerRuntimeDocker --swift-sdk "${{ matrix.swift-sdk }}")
          swift build "${args[@]}"
          build_dir="$(swift build "${args[@]}" --show-bin-path)"
          mkdir -p ~/.agentc/bin
          cp "$build_dir/agentc-bootstrap" ~/.agentc/bin/bootstrap
          chmod +x ~/.agentc/bin/bootstrap
          file ~/.agentc/bin/bootstrap | tee /dev/stderr | grep -q "statically linked"

      # This exercises only the bootstrap, which is identical for both CLI builds.
      - name: Test bootstrap in a scratch image
        if: needs.changes.outputs.integration == 'true'
        timeout-minutes: 5
        run: python3 scripts/test-mcp-relay-minimal.py

      - name: Pre-pull base images for tests
        if: needs.changes.outputs.integration == 'true'
        run: |
          docker pull docker.io/library/debian:latest
          docker pull docker.io/library/alpine:latest
          docker pull docker.io/library/buildpack-deps:scm
          docker pull docker.io/library/swift:6.4.2

      - name: Build native release binary
        if: needs.changes.outputs.integration == 'true'
        run: bash build.sh --runtimes docker

      - name: Test native release binary
        if: needs.changes.outputs.integration == 'true'
        timeout-minutes: 10
        run: bash scripts/ci/test-integration.sh

      - name: Build static binary
        if: needs.changes.outputs.integration == 'true'
        run: bash build.sh --runtimes docker --swift-sdk ${{ matrix.swift-sdk }}

      - name: Verify static linking
        if: needs.changes.outputs.integration == 'true'
        run: |
          file ./agentc | tee /dev/stderr | grep -q "statically linked"

      - name: Test static release binary
        if: needs.changes.outputs.integration == 'true'
        timeout-minutes: 10
        run: bash scripts/ci/test-integration.sh

  # A stable required check: skipped jobs are OK, failed/cancelled jobs are not.
  test-result:
    name: Test result
    needs: [changes, unit-tests, linux-tests, runtime-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check selected jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .changes.result == "success" and
            all(.[]; .result == "success" or .result == "skipped")
          '
