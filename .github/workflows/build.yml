name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            runtimes: apple-container,docker
            variant: arm64-macos
          - os: macos-26-intel
            arch: x64
            runtimes: apple-container,docker
            variant: x64-macos
          - os: ubuntu-24.04
            arch: x64
            runtimes: docker
            variant: x64-linux
          - os: ubuntu-24.04-arm
            arch: arm64
            runtimes: docker
            variant: arm64-linux
          - os: ubuntu-24.04
            arch: x64
            runtimes: docker
            variant: x64-linux-static
            swift-sdk: x86_64-swift-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            runtimes: docker
            variant: arm64-linux-static
            swift-sdk: aarch64-swift-linux-musl

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          static-sdk: ${{ matrix.swift-sdk && 'true' || 'false' }}

      - name: Build release binaries
        run: bash build.sh --runtimes "${{ matrix.runtimes }}"${{ matrix.swift-sdk && format(' --swift-sdk {0}', matrix.swift-sdk) || '' }}
        env:
          BUILD_VERSION: ${{ github.ref_name }}
          BUILD_GIT_SHA: ${{ github.sha }}

      - name: Verify static linking
        if: matrix.swift-sdk
        run: |
          file ./agentc | tee /dev/stderr | grep -q "statically linked"

      - name: Package binary
        run: |
          tar czf "agentc-${{ matrix.variant }}.tar.gz" agentc

      - name: Upload agentc artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentc-${{ matrix.variant }}
          path: agentc-${{ matrix.variant }}.tar.gz
          compression-level: 0

      # Reuse the static job's toolchain, SDK, and dependency build products.
      - name: Build bootstrap binary
        if: matrix.swift-sdk
        run: |
          args=(--product agentc-bootstrap -c release --disable-default-traits --traits ContainerRuntimeDocker --swift-sdk "${{ matrix.swift-sdk }}")
          swift build "${args[@]}"
          build_dir="$(swift build "${args[@]}" --show-bin-path)"
          cp "$build_dir/agentc-bootstrap" agentc-bootstrap

      - name: Verify bootstrap static linking
        if: matrix.swift-sdk
        run: |
          file ./agentc-bootstrap | tee /dev/stderr | grep -q "statically linked"

      - name: Package bootstrap binary
        if: matrix.swift-sdk
        run: |
          tar czf "agentc-bootstrap-${{ matrix.variant }}.tar.gz" agentc-bootstrap

      - name: Upload bootstrap artifact
        if: matrix.swift-sdk
        uses: actions/upload-artifact@v7
        with:
          name: agentc-bootstrap-${{ matrix.variant }}
          path: agentc-bootstrap-${{ matrix.variant }}.tar.gz
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
