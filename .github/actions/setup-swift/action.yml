name: Setup Swift
description: Install the pinned Swift toolchain and, optionally, the Static Linux SDK.

inputs:
  static-sdk:
    description: Set to "true" to install the Static Linux SDK.
    required: false
    default: "false"
  cache-scope:
    description: Optional build-cache namespace (separates build flags and concurrent writers).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: "6.4.2"
        # Refresh the release catalog; the action's default snapshot predates 6.4.2.
        check-latest: true

    # Cache entries are immutable. Include the revision so a restored build can
    # be updated, while restoring only builds with compatible tools/dependencies.
    - name: Cache SPM build artifacts
      if: inputs.cache-scope != ''
      uses: actions/cache@v6
      with:
        path: .build
        key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('.swift-version', '.github/actions/setup-swift/action.yml', 'Package.swift', 'Package.resolved') }}-${{ github.sha }}
        restore-keys: |
          spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('.swift-version', '.github/actions/setup-swift/action.yml', 'Package.swift', 'Package.resolved') }}-

    - name: Cache Static Linux SDK
      if: inputs.static-sdk == 'true'
      id: cache-static-sdk
      uses: actions/cache@v6
      with:
        path: ~/.swiftpm/swift-sdks
        key: static-sdk-6.4.2-${{ runner.arch }}

    - name: Install Static Linux SDK
      if: inputs.static-sdk == 'true' && steps.cache-static-sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Swift 6.3.3 can crash in FoundationNetworking cleanup after downloading
        # the SDK on Linux ARM64. Install from disk to avoid that network path.
        sdk_archive="$RUNNER_TEMP/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz"
        curl --fail --location --retry 3 --output "$sdk_archive" \
          https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
        # swift sdk install only validates --checksum for remote URLs.
        printf '%s  %s\n' \
          3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a \
          "$sdk_archive" | sha256sum --check
        swift sdk install "$sdk_archive"
